<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">From classroom fault to accountable resolution</title>
  <desc id="desc">One workflow connects self-help, reporting, ownership, escalation and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/><stop offset="1" stop-color="#111b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9aa9bc"/>
    </marker>
  </defs>
  <rect width="1600" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="180" fill="#5d87ff" opacity=".06"/>
  <circle cx="70" cy="565" r="150" fill="#ffae00" opacity=".05"/>
  <text x="64" y="68" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">From classroom fault to accountable resolution</text>
  <text x="64" y="101" fill="#9aa9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">One workflow connects self-help, reporting, ownership, escalation and learning.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="64" y="174" width="6" height="186" rx="3" fill="#36d9cc"/>
    <circle cx="102" cy="212" r="18" fill="#36d9cc" opacity=".17"/>
    <text x="102" y="218" text-anchor="middle" fill="#36d9cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">1</text>
    <text x="132" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Diagnose</text>
    <text x="92" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="92" dy="0">Guided checks</tspan><tspan x="92" dy="23">approved resources</tspan></text>
  </g><path d="M294 267H304" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="312" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="312" y="174" width="6" height="186" rx="3" fill="#5d87ff"/>
    <circle cx="350" cy="212" r="18" fill="#5d87ff" opacity=".17"/>
    <text x="350" y="218" text-anchor="middle" fill="#5d87ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">2</text>
    <text x="380" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Report</text>
    <text x="340" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="340" dy="0">Structured symptoms</tspan><tspan x="340" dy="23">impact + evidence</tspan></text>
  </g><path d="M542 267H552" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="560" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="560" y="174" width="6" height="186" rx="3" fill="#ffae00"/>
    <circle cx="598" cy="212" r="18" fill="#ffae00" opacity=".17"/>
    <text x="598" y="218" text-anchor="middle" fill="#ffae00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">3</text>
    <text x="628" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Own</text>
    <text x="588" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="588" dy="0">School triage or</tspan><tspan x="588" dy="23">field assignment</tspan></text>
  </g><path d="M790 267H800" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="808" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="808" y="174" width="6" height="186" rx="3" fill="#ff6577"/>
    <circle cx="846" cy="212" r="18" fill="#ff6577" opacity=".17"/>
    <text x="846" y="218" text-anchor="middle" fill="#ff6577" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">4</text>
    <text x="876" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Escalate</text>
    <text x="836" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="836" dy="0">Reason + timestamp</tspan><tspan x="836" dy="23">SLA + notification</tspan></text>
  </g><path d="M1038 267H1048" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1056" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="1056" y="174" width="6" height="186" rx="3" fill="#2dd98a"/>
    <circle cx="1094" cy="212" r="18" fill="#2dd98a" opacity=".17"/>
    <text x="1094" y="218" text-anchor="middle" fill="#2dd98a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">5</text>
    <text x="1124" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Resolve</text>
    <text x="1084" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="1084" dy="0">Timeline + proof</tspan><tspan x="1084" dy="23">reporter feedback</tspan></text>
  </g><path d="M1286 267H1296" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1304" y="174" width="224" height="186" rx="20" fill="#121925" stroke="#2b3a4e"/>
    <rect x="1304" y="174" width="6" height="186" rx="3" fill="#a88bff"/>
    <circle cx="1342" cy="212" r="18" fill="#a88bff" opacity=".17"/>
    <text x="1342" y="218" text-anchor="middle" fill="#a88bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">6</text>
    <text x="1372" y="218" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Learn</text>
    <text x="1332" y="258" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="1332" dy="0">Trends + guides</tspan><tspan x="1332" dy="23">prevent recurrence</tspan></text>
  </g><rect x="64" y="405" width="1472" height="132" rx="20" fill="#172131" stroke="#2b3a4e"/>
    <text x="94" y="449" fill="#ffae00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">SUCCESS MEANS</text>
    <text x="94" y="486" fill="#f5f7fb" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600"><tspan x="94" dy="0">The user gets the right next step, the fault gets one accountable owner,</tspan><tspan x="94" dy="31">and every completed fix leaves evidence the support team can reuse.</tspan></text>
</svg>