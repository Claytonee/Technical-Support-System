<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Support intelligence</title>
  <desc id="desc">The AI assistant and Resource Library use approved support context to guide diagnosis, while users can always continue to the normal fault-reporting workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b24"/><stop offset="1" stop-color="#08133b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3478ff"/><stop offset="1" stop-color="#21d4e8"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#21d4e8" stop-opacity=".22"/><stop offset="1" stop-color="#21d4e8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#21d4e8"/></marker>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#background)"/>
  <g fill="#91a6d8" opacity=".34"><circle cx="72" cy="42" r="1.2"/><circle cx="188" cy="74" r="1"/><circle cx="322" cy="31" r="1.1"/><circle cx="449" cy="66" r="1.3"/><circle cx="604" cy="35" r="1"/><circle cx="761" cy="69" r="1.2"/><circle cx="925" cy="37" r="1"/><circle cx="1084" cy="76" r="1.2"/></g>
<text x="52" y="57" fill="#3478ff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1" opacity="1">SUPPORT INTELLIGENCE</text><text x="52" y="88" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">AI accelerates diagnosis; approved knowledge and the support workflow remain authoritative</text>
    <g><rect x="52" y="151" width="218" height="150" rx="17" fill="#0a1742" stroke="#3478ff"/><text x="79" y="183" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1" opacity="1">USER SIGNAL</text><text x="79" y="222" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">“The display turns on,</text><text x="79" y="247" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">then loses signal.”</text><text x="79" y="278" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">school + device + symptom</text></g>
    <path d="M270 226H373" fill="none" stroke="#3478ff" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#21d4e8" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M270 226H373"/>
  </circle>
    <g><circle cx="486" cy="226" r="96" fill="url(#glow)"/><path d="M486 137L563 181V271L486 315L409 271V181Z" fill="#0d1d50" stroke="url(#signal)" stroke-width="2.3"/><path d="M486 171L534 199V253L486 281L438 253V199Z" fill="none" stroke="#21d4e8" opacity=".52"/><text x="486" y="214" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2.1" opacity="1">SUPPORT CONTEXT</text><text x="486" y="244" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1" opacity="1">KNOWLEDGE</text><text x="486" y="267" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">approved + searchable</text><circle cx="486" cy="226" r="6" fill="#ffb229"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></circle></g>
    <path d="M563 190C618 143 650 151 700 151" fill="none" stroke="#3478ff" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="3.4s" begin="-.7s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#21d4e8" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="3.4s" begin="-.7s" repeatCount="indefinite" path="M563 190C618 143 650 151 700 151"/>
  </circle>
    <path d="M563 262C618 309 650 322 700 322" fill="none" stroke="#39dfa0" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="3.4s" begin="-1.6s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#39dfa0" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="3.4s" begin="-1.6s" repeatCount="indefinite" path="M563 262C618 309 650 322 700 322"/>
  </circle>
    <g><rect x="700" y="105" width="270" height="126" rx="16" fill="#0a1742" stroke="#21d4e8" stroke-width="1.6"/><text x="729" y="139" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1" opacity="1">AI ASSISTANT</text><text x="729" y="176" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Explains the next</text><text x="729" y="201" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">safe diagnostic step</text></g>
    <g><rect x="700" y="252" width="270" height="140" rx="16" fill="#0a1742" stroke="#39dfa0" stroke-width="1.6"/><text x="729" y="286" fill="#39dfa0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1" opacity="1">RESOURCE LIBRARY</text><text x="729" y="322" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Returns approved manuals,</text><text x="729" y="347" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">guides and support media</text><text x="729" y="373" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">searchable by support context</text></g>
    <path d="M970 168H1004V239H1030" fill="none" stroke="#3478ff" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="3s" begin="-.4s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#21d4e8" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="3s" begin="-.4s" repeatCount="indefinite" path="M970 168H1004V239H1030"/>
  </circle>
    <path d="M970 322H1004V239H1030" fill="none" stroke="#39dfa0" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="3s" begin="-1.8s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#39dfa0" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="3s" begin="-1.8s" repeatCount="indefinite" path="M970 322H1004V239H1030"/>
  </circle>
    <g><rect x="1030" y="166" width="118" height="146" rx="15" fill="#0d1d50" stroke="#ffb229" stroke-width="1.6"/><text x="1089" y="199" fill="#ffb229" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2.1" opacity="1">DECISION</text><text x="1089" y="234" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="0" opacity="1">Continue</text><text x="1089" y="257" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="0" opacity="1">locally</text><text x="1089" y="281" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">or report</text></g>
    <path d="M1089 330V418H486V330" fill="none" stroke="#6074aa" stroke-width="1.3" stroke-dasharray="7 10" opacity=".72">
    <animate attributeName="stroke-dashoffset" values="34;0" dur="7s" begin="-2s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#39dfa0" stroke="#050b24" stroke-width="1.5">
    <animateMotion dur="7s" begin="-2s" repeatCount="indefinite" path="M1089 330V418H486V330"/>
  </circle><text x="760" y="411" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">verified resolutions strengthen future support content</text>
</svg>