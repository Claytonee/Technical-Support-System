<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">What each core capability does</title>
  <desc id="desc">Every feature starts with a user need and ends with an observable system outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/><stop offset="1" stop-color="#111b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9aa9bc"/>
    </marker>
  </defs>
  <rect width="1600" height="840" rx="28" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="180" fill="#5d87ff" opacity=".06"/>
  <circle cx="70" cy="805" r="150" fill="#ffae00" opacity=".05"/>
  <text x="64" y="68" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">What each core capability does</text>
  <text x="64" y="101" fill="#9aa9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Every feature starts with a user need and ends with an observable system outcome.</text>
  <g filter="url(#shadow)">
      <rect x="64" y="164" width="712" height="284" rx="22" fill="#121925" stroke="#2b3a4e"/>
      <rect x="64" y="164" width="712" height="7" rx="4" fill="#5d87ff"/>
      <text x="96" y="219" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">Error Form</text>
      <text x="96" y="262" fill="#5d87ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">USER PROVIDES</text>
      <text x="96" y="294" fill="#f5f7fb" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="96" dy="0">symptoms, impact, location,</tspan><tspan x="96" dy="25">affected equipment and evidence</tspan></text>
      <line x1="96" y1="348" x2="744" y2="348" stroke="#2b3a4e"/>
      <text x="96" y="382" fill="#5d87ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">SYSTEM CREATES</text>
      <text x="96" y="414" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="96" dy="0">a deduplicated fault, SLA due time,</tspan><tspan x="96" dy="25">school scope and initial owner</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="824" y="164" width="712" height="284" rx="22" fill="#121925" stroke="#2b3a4e"/>
      <rect x="824" y="164" width="712" height="7" rx="4" fill="#ff6577"/>
      <text x="856" y="219" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">Escalation</text>
      <text x="856" y="262" fill="#ff6577" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">SCHOOL ADMIN PROVIDES</text>
      <text x="856" y="294" fill="#f5f7fb" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="856" dy="0">a reason and operational context</tspan></text>
      <line x1="856" y1="348" x2="1504" y2="348" stroke="#2b3a4e"/>
      <text x="856" y="382" fill="#ff6577" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">SYSTEM RECORDS</text>
      <text x="856" y="414" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="856" dy="0">platform ownership, engineer assignment,</tspan><tspan x="856" dy="25">timestamps, timeline and notifications</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="64" y="500" width="712" height="284" rx="22" fill="#121925" stroke="#2b3a4e"/>
      <rect x="64" y="500" width="712" height="7" rx="4" fill="#a88bff"/>
      <text x="96" y="555" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">AI Assistant</text>
      <text x="96" y="598" fill="#a88bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">USER ASKS</text>
      <text x="96" y="630" fill="#f5f7fb" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="96" dy="0">a support question in their own words</tspan></text>
      <line x1="96" y1="684" x2="744" y2="684" stroke="#2b3a4e"/>
      <text x="96" y="718" fill="#a88bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">SYSTEM RETURNS</text>
      <text x="96" y="750" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="96" dy="0">resource-grounded diagnostic steps</tspan><tspan x="96" dy="25">while preserving normal support access</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="824" y="500" width="712" height="284" rx="22" fill="#121925" stroke="#2b3a4e"/>
      <rect x="824" y="500" width="712" height="7" rx="4" fill="#2dd98a"/>
      <text x="856" y="555" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">Resource Library</text>
      <text x="856" y="598" fill="#2dd98a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">SUPPORT TEAM PUBLISHES</text>
      <text x="856" y="630" fill="#f5f7fb" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="856" dy="0">approved manuals, guides and media</tspan></text>
      <line x1="856" y1="684" x2="1504" y2="684" stroke="#2b3a4e"/>
      <text x="856" y="718" fill="#2dd98a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">USERS GET</text>
      <text x="856" y="750" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="856" dy="0">searchable, reusable knowledge linked</tspan><tspan x="856" dy="25">to diagnosis and future reports</tspan></text>
    </g>
</svg>