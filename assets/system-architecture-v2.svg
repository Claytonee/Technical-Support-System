<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Architecture shaped by the operating environment</title>
  <desc id="desc">Offline reliability and access control are part of the design, not add-ons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/><stop offset="1" stop-color="#111b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9aa9bc"/>
    </marker>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="180" fill="#5d87ff" opacity=".06"/>
  <circle cx="70" cy="685" r="150" fill="#ffae00" opacity=".05"/>
  <text x="64" y="68" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Architecture shaped by the operating environment</text>
  <text x="64" y="101" fill="#9aa9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Offline reliability and access control are part of the design, not add-ons.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="170" width="420" height="250" rx="22" fill="#121925" stroke="#2b3a4e"/>
    <text x="92" y="205" fill="#36d9cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.3">SCHOOL EXPERIENCE</text>
    <text x="92" y="243" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">Vanilla JS SPA / PWA</text>
    <text x="92" y="282" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="92" dy="0">Guided resolution + error form</tspan><tspan x="92" dy="25">Service worker + IndexedDB queue</tspan><tspan x="92" dy="25">Role-aware dashboards</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="590" y="150" width="420" height="290" rx="22" fill="#121925" stroke="#2b3a4e"/>
    <text x="618" y="185" fill="#ffae00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.3">APPLICATION CORE</text>
    <text x="618" y="223" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">Node.js / Express API</text>
    <text x="618" y="262" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="618" dy="0">JWT + MFA + scoped RBAC</tspan><tspan x="618" dy="25">Fault lifecycle + SLA sweep</tspan><tspan x="618" dy="25">Search, analytics + audit</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="1116" y="170" width="420" height="250" rx="22" fill="#121925" stroke="#2b3a4e"/>
    <text x="1144" y="205" fill="#5d87ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.3">OPERATIONS</text>
    <text x="1144" y="243" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">MySQL + Cloudinary</text>
    <text x="1144" y="282" fill="#9aa9bc" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="1144" dy="0">Operational records + history</tspan><tspan x="1144" dy="25">Evidence + approved resources</tspan><tspan x="1144" dy="25">Additive schema extensions</tspan></text>
  </g><path d="M490 295H572" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="531" y="285" text-anchor="middle" fill="#9aa9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">HTTPS / JWT</text><path d="M1016 295H1098" fill="none" stroke="#9aa9bc" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="1057" y="285" text-anchor="middle" fill="#9aa9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">queries + files</text><rect x="202" y="505" width="1196" height="150" rx="22" fill="#172131" stroke="#2b3a4e"/>
    <text x="800" y="548" text-anchor="middle" fill="#a88bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">OPTIONAL ADAPTERS</text>
    <text x="800" y="590" fill="#f5f7fb" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600"><tspan x="800" dy="0">AI answers · email alerts · WhatsApp / SMS / USSD intake · LRS heartbeat</tspan><tspan x="800" dy="31">The core web workflow remains complete when any adapter is not configured.</tspan></text>
</svg>