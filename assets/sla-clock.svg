<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="1200" height="344" role="img" aria-label="The SLA engine: four priority tiers with hard targets, a critical fault breaching four hours and escalating"><!--(c) 2026 Claytone Curthberth Mhina. Artwork and text all rights reserved.--><defs><clipPath id="card"><rect x="0" y="0" width="1200" height="344" rx="14"/></clipPath></defs><g clip-path="url(#card)" font-family="DM Sans, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1200" height="344" fill="#0f1117"/><rect x="0" y="0" width="1200" height="3" fill="#FFAE00"/><text x="48" y="52" font-size="15" font-weight="600" letter-spacing="2.2" fill="#636a82">THE CLOCK</text><text x="48" y="76" font-size="13.5" fill="#9ba1b5">Every fault is stamped with a deadline the moment it is filed. Nothing waits on somebody remembering it.</text><circle cx="52" cy="118" r="5" fill="#ff5263"/><text x="68" y="123" font-size="13" font-weight="600" fill="#e8eaf2">CRITICAL</text><text x="228" y="123" font-size="13" font-family="DM Mono, SFMono-Regular, Consolas, monospace" fill="#9ba1b5" text-anchor="end">&#8804; 4 h</text><rect x="250" y="110" width="700" height="16" rx="8" fill="#1d2130" stroke="rgba(255,255,255,0.08)"/><rect x="250" y="110" width="0" height="16" rx="8" fill="#2dd98a"><animate attributeName="width" values="0;0;700;700;0" keyTimes="0;0.05;0.40;0.97;1" dur="8s" repeatCount="indefinite"/><animate attributeName="fill" values="#2dd98a;#2dd98a;#ff5263;#ff5263;#2dd98a" keyTimes="0;0.34;0.42;0.97;1" dur="8s" repeatCount="indefinite"/></rect><rect x="992" y="106" width="160" height="24" rx="12" fill="none" stroke="#2dd98a"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.42;0.97;1" dur="8s" repeatCount="indefinite"/></rect><rect x="992" y="106" width="160" height="24" rx="12" fill="none" stroke="#ff5263" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></rect><text x="1072" y="122" font-size="11.5" font-weight="600" fill="#2dd98a" text-anchor="middle">WITHIN TARGET<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.42;0.97;1" dur="8s" repeatCount="indefinite"/></text><text x="1072" y="122" font-size="11.5" font-weight="600" fill="#ff5263" text-anchor="middle" opacity="0">BREACHED<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></text><circle cx="52" cy="166" r="5" fill="#f5a623"/><text x="68" y="171" font-size="13" font-weight="600" fill="#e8eaf2">HIGH</text><text x="228" y="171" font-size="13" font-family="DM Mono, SFMono-Regular, Consolas, monospace" fill="#9ba1b5" text-anchor="end">&#8804; 24 h</text><rect x="250" y="158" width="700" height="16" rx="8" fill="#1d2130" stroke="rgba(255,255,255,0.08)"/><rect x="250" y="158" width="0" height="16" rx="8" fill="#2dd98a"><animate attributeName="width" values="0;0;434;434;0" keyTimes="0;0.05;0.92;0.97;1" dur="8s" repeatCount="indefinite"/></rect><rect x="992" y="154" width="160" height="24" rx="12" fill="none" stroke="#2dd98a" stroke-opacity="0.7"/><text x="1072" y="170" font-size="11.5" font-weight="600" fill="#2dd98a" text-anchor="middle">WITHIN TARGET</text><circle cx="52" cy="214" r="5" fill="#4f7cff"/><text x="68" y="219" font-size="13" font-weight="600" fill="#e8eaf2">MEDIUM</text><text x="228" y="219" font-size="13" font-family="DM Mono, SFMono-Regular, Consolas, monospace" fill="#9ba1b5" text-anchor="end">&#8804; 72 h</text><rect x="250" y="206" width="700" height="16" rx="8" fill="#1d2130" stroke="rgba(255,255,255,0.08)"/><rect x="250" y="206" width="0" height="16" rx="8" fill="#2dd98a"><animate attributeName="width" values="0;0;266;266;0" keyTimes="0;0.05;0.92;0.97;1" dur="8s" repeatCount="indefinite"/></rect><rect x="992" y="202" width="160" height="24" rx="12" fill="none" stroke="#2dd98a" stroke-opacity="0.7"/><text x="1072" y="218" font-size="11.5" font-weight="600" fill="#2dd98a" text-anchor="middle">WITHIN TARGET</text><circle cx="52" cy="262" r="5" fill="#636a82"/><text x="68" y="267" font-size="13" font-weight="600" fill="#e8eaf2">LOW</text><text x="228" y="267" font-size="13" font-family="DM Mono, SFMono-Regular, Consolas, monospace" fill="#9ba1b5" text-anchor="end">&#8804; 168 h</text><rect x="250" y="254" width="700" height="16" rx="8" fill="#1d2130" stroke="rgba(255,255,255,0.08)"/><rect x="250" y="254" width="0" height="16" rx="8" fill="#2dd98a"><animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.05;0.92;0.97;1" dur="8s" repeatCount="indefinite"/></rect><rect x="992" y="250" width="160" height="24" rx="12" fill="none" stroke="#2dd98a" stroke-opacity="0.7"/><text x="1072" y="266" font-size="11.5" font-weight="600" fill="#2dd98a" text-anchor="middle">WITHIN TARGET</text><line x1="48" y1="296" x2="1152" y2="296" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="48" y="324" font-size="13" fill="#e8eaf2">A breach escalates on its own <tspan fill="#636a82">&#183; up the owner&#8217;s chain, never past the person who can walk to the room</tspan></text></g><metadata><rights>Copyright 2026 Claytone Curthberth Mhina. The system is the property of Opportunity Education Tanzania. The artwork and text of this page are all rights reserved; no license granted without written permission.</rights></metadata></svg>