<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Technical Support System</title>
  <desc id="desc">Offline-first fault reporting, routing, escalation and support knowledge for schools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b24"/><stop offset="1" stop-color="#08133b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3478ff"/><stop offset="1" stop-color="#21d4e8"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#21d4e8" stop-opacity=".22"/><stop offset="1" stop-color="#21d4e8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#21d4e8"/></marker>
  </defs>
  <rect width="1200" height="280" rx="22" fill="url(#background)"/>
  <g fill="#91a6d8" opacity=".34"><circle cx="72" cy="42" r="1.2"/><circle cx="188" cy="74" r="1"/><circle cx="322" cy="31" r="1.1"/><circle cx="449" cy="66" r="1.3"/><circle cx="604" cy="35" r="1"/><circle cx="761" cy="69" r="1.2"/><circle cx="925" cy="37" r="1"/><circle cx="1084" cy="76" r="1.2"/></g>
<circle cx="178" cy="145" r="132" fill="url(#glow)"/>
    <circle cx="178" cy="145" r="78" fill="none" stroke="#3478ff" stroke-width="1.2" stroke-dasharray="5 10" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0 178 145" to="360 178 145" dur="60s" repeatCount="indefinite"/></circle>
    <path d="M178 73L240 109V181L178 217L116 181V109Z" fill="#0a1742" stroke="url(#signal)" stroke-width="2.4"/>
    <path d="M178 103L214 124V166L178 187L142 166V124Z" fill="none" stroke="#21d4e8" stroke-width="1" opacity=".6"/>
    <g stroke="#3478ff" stroke-width="1.2" opacity=".82"><path d="M178 145V73"/><path d="M178 145L240 109"/><path d="M178 145L240 181"/><path d="M178 145V217"/><path d="M178 145L116 181"/><path d="M178 145L116 109"/></g>
    <circle cx="178" cy="145" r="19" fill="#ffb229" opacity=".16" filter="url(#softGlow)"><animate attributeName="r" values="17;27;17" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="145" r="9" fill="#ffb229"/>
    <g fill="#21d4e8"><circle cx="178" cy="73" r="5"/><circle cx="240" cy="109" r="5"/><circle cx="240" cy="181" r="5"/><circle cx="178" cy="217" r="5"/><circle cx="116" cy="181" r="5"/><circle cx="116" cy="109" r="5"/></g>
    <circle r="3" fill="#f7f9ff"><animateMotion dur="6s" repeatCount="indefinite" path="M178 73L240 109L240 181L178 217L116 181L116 109Z"/></circle>
    <text x="330" y="95" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="750" text-anchor="start" letter-spacing="0.8" opacity="1">TECHNICAL SUPPORT SYSTEM</text>
    <rect x="332" y="111" width="138" height="4" rx="2" fill="url(#signal)"/>
    <text x="331" y="145" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Fault reporting, accountable ownership and field support for schools</text>
    <text x="331" y="176" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Offline-first PWA  ·  Express  ·  MySQL  ·  Scoped RBAC</text>
    <g><rect x="331" y="199" width="174" height="34" rx="17" fill="#050b24" stroke="#3478ff"/><rect x="519" y="199" width="174" height="34" rx="17" fill="#050b24" stroke="#3478ff"/><rect x="707" y="199" width="174" height="34" rx="17" fill="#050b24" stroke="#3478ff"/>
      <text x="418" y="221" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" text-anchor="middle" letter-spacing="0.8" opacity="1">ONE FAULT RECORD</text><text x="606" y="221" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" text-anchor="middle" letter-spacing="0.8" opacity="1">SLA OWNERSHIP</text><text x="794" y="221" fill="#21d4e8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" text-anchor="middle" letter-spacing="0.8" opacity="1">OFFLINE-SAFE</text></g>
    <path d="M925 63V229" stroke="#3478ff" stroke-width="1" opacity=".42"/>
    <text x="963" y="92" fill="#ffb229" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.1" opacity="1">OUTCOME</text><text x="963" y="127" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">A fault reaches</text><text x="963" y="154" fill="#f7f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="750" text-anchor="start" letter-spacing="0" opacity="1">the right owner</text><text x="963" y="181" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">with enough context</text><text x="963" y="205" fill="#91a6d8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">to act.</text>
</svg>