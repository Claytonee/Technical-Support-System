    <rect x="52" y="158" width="190" height="112" rx="15" fill="#0a1742" stroke="#3478ff" stroke-width="1.1"/>
    <rect x="53" y="159" width="4" height="110" rx="2" fill="#21d4e8" opacity="0.72"/>
