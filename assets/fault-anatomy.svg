<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a fault</title>
  <desc id="desc">A structured error report is saved offline when needed, routed to an accountable owner, governed by escalation and SLA rules, and closed with evidence and feedback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b24"/><stop offset="1" stop-color="#08133b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3478ff"/><stop offset="1" stop-color="#21d4e8"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#21d4e8" stop-opacity=".22"/><stop offset="1" stop-color="#21d4e8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#21d4e8"/></marker>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#background)"/>
