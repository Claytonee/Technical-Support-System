<rect x="1000" y="110" width="152" height="24" rx="12" stroke="#F20002" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1000" y="158" width="152" height="24" rx="12" stroke="#34D399" stroke-opacity="0.8"/>
<rect x="1000" y="206" width="152" height="24" rx="12" stroke="#34D399" stroke-opacity="0.8"/>
<rect x="1000" y="254" width="152" height="24" rx="12" stroke="#34D399" stroke-opacity="0.8"/>
</g>
<g font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">
<text x="1076" y="127" fill="#34D399">WITHIN SLA<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.42;0.97;1" dur="8s" repeatCount="indefinite"/></text>
<text x="1076" y="127" fill="#F20002" opacity="0">BREACHED<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></text>
<text x="1076" y="175" fill="#34D399">WITHIN SLA</text>
<text x="1076" y="223" fill="#34D399">WITHIN SLA</text>
<text x="1076" y="271" fill="#34D399">WITHIN SLA</text>
