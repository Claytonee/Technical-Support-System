<rect x="256" y="258" width="0" height="16" rx="8" fill="#34D399"><animate attributeName="width" values="0;0;129;129;0" keyTimes="0;0.05;0.92;0.97;1" dur="8s" repeatCount="indefinite"/></rect>

<g fill="#04092A">
