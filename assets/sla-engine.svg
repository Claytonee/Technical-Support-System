<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Automated SLA engine: four priority tiers with hard deadlines, showing a critical fault breaching its two-hour deadline and escalating"><!--(c) 2026 Claytone Curthberth Mhina. Artwork and text all rights reserved.-->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00072D"/><stop offset="1" stop-color="#00085B"/></linearGradient>
<radialGradient id="burn" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F20002" stop-opacity="0.40"/><stop offset="1" stop-color="#F20002" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect x="0" y="0" width="1200" height="350" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1200" height="350" fill="url(#bg)"/>
