<line x1="48" y1="296" x2="1152" y2="296" stroke="#0E4DFF" stroke-width="1" opacity="0.28"/>
<text x="48" y="324" font-size="13" fill="#EAF7F3">A breached deadline escalates on its own <tspan fill="#5F79C0">&#183; to the field team, then to leadership &#183; no reported fault sits unowned</tspan></text>
<text x="1152" y="324" text-anchor="end" font-size="12" letter-spacing="1.2" fill="#5F79C0" opacity="0">ESCALATING<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.48;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></text>
</g>
