<text x="48" y="48" font-size="16" font-weight="600" letter-spacing="2.4" fill="#5F79C0">AUTOMATED SLA ENGINE</text>
<text x="48" y="74" font-size="14" fill="#9DB4E8">Every reported fault is triaged into one of four tiers, each with a hard deadline and automatic breach detection</text>
<g font-size="13" fill="#9DB4E8"><circle cx="960" cy="43" r="5" fill="#34D399"/><text x="974" y="48">within SLA</text><circle cx="1064" cy="43" r="5" fill="#F20002"/><text x="1078" y="48">breached</text></g>

<g font-size="13.5" font-weight="700" fill="#EAF7F3">
<circle cx="52" cy="122" r="5" fill="#F20002"/><text x="66" y="127">CRITICAL</text>
<circle cx="52" cy="170" r="5" fill="#17D9F9"/><text x="66" y="175">HIGH</text>
<circle cx="52" cy="218" r="5" fill="#0E4DFF"/><text x="66" y="223">MEDIUM</text>
<circle cx="52" cy="266" r="5" fill="#5F79C0"/><text x="66" y="271">LOW</text>
</g>
<g font-size="13" fill="#9DB4E8" text-anchor="end">
<text x="232" y="127">&#8804; 2 h</text><text x="232" y="175">&#8804; 8 h</text><text x="232" y="223">&#8804; 24 h</text><text x="232" y="271">&#8804; 72 h</text>
</g>

<g fill="#04092A" stroke="#0E4DFF" stroke-opacity="0.35">
<rect x="256" y="114" width="716" height="16" rx="8"/>
<rect x="256" y="162" width="716" height="16" rx="8"/>
<rect x="256" y="210" width="716" height="16" rx="8"/>
<rect x="256" y="258" width="716" height="16" rx="8"/>
</g>

<ellipse cx="972" cy="122" rx="60" ry="42" fill="url(#burn)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.44;0.90;0.97;1" dur="8s" repeatCount="indefinite"/></ellipse>

<rect x="256" y="114" width="0" height="16" rx="8" fill="#34D399">
