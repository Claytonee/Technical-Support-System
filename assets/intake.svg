<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Three intake channels — web form, WhatsApp and LRS heartbeat — converging on one triage, SLA clock and escalation chain"><!--(c) 2026 Claytone Curthberth Mhina. Artwork and text all rights reserved.--><defs><clipPath id="card"><rect x="0" y="0" width="1200" height="400" rx="14"/></clipPath></defs><g clip-path="url(#card)" font-family="DM Sans, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1200" height="400" fill="#0f1117"/><rect x="0" y="0" width="1200" height="3" fill="#FFAE00"/><text x="48" y="52" font-size="15" font-weight="600" letter-spacing="2.2" fill="#636a82">THREE WAYS A FAULT GETS IN</text><text x="48" y="76" font-size="13.5" fill="#9ba1b5">Only one of them involves somebody remembering to open the app</text><rect x="48" y="88" width="300" height="60" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><rect x="48" y="88" width="3" height="60" rx="1.5" fill="#4f7cff"/><text x="70" y="112" font-size="13" font-weight="600" letter-spacing="1.1" fill="#4f7cff">WEB FORM</text><text x="70" y="133" font-size="11.5" fill="#636a82">teacher or school admin files a report</text><path d="M348 118 C 460 118, 500 196, 586 196" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.6"/><circle r="4.5" fill="#4f7cff" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M348,118 C 460 118, 500 196, 586 196" keyPoints="0;0;1;1" keyTimes="0;0.04;0.24000000000000002;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.045;0.24000000000000002;0.245;1" dur="9s" repeatCount="indefinite"/></circle><rect x="48" y="166" width="300" height="60" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><rect x="48" y="166" width="3" height="60" rx="1.5" fill="#2dd98a"/><text x="70" y="190" font-size="13" font-weight="600" letter-spacing="1.1" fill="#2dd98a">WHATSAPP</text><text x="70" y="211" font-size="11.5" fill="#636a82">assistant answers first, then offers to log it</text><path d="M348 196 C 460 196, 500 196, 586 196" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.6"/><circle r="4.5" fill="#2dd98a" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M348,196 C 460 196, 500 196, 586 196" keyPoints="0;0;1;1" keyTimes="0;0.3;0.5;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.305;0.5;0.505;1" dur="9s" repeatCount="indefinite"/></circle><rect x="48" y="244" width="300" height="60" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><rect x="48" y="244" width="3" height="60" rx="1.5" fill="#36d9cc"/><text x="70" y="268" font-size="13" font-weight="600" letter-spacing="1.1" fill="#36d9cc">LRS HEARTBEAT</text><text x="70" y="289" font-size="11.5" fill="#636a82">a school goes silent — the monitor files it itself</text><path d="M348 274 C 460 274, 500 196, 586 196" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.6"/><circle r="4.5" fill="#36d9cc" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M348,274 C 460 274, 500 196, 586 196" keyPoints="0;0;1;1" keyTimes="0;0.56;0.76;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.565;0.76;0.765;1" dur="9s" repeatCount="indefinite"/></circle><rect x="586" y="160" width="172" height="72" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><text x="672" y="188" font-size="12.5" font-weight="600" letter-spacing="1.1" fill="#e8eaf2" text-anchor="middle">TRIAGE</text><text x="672" y="210" font-size="11.5" fill="#636a82" text-anchor="middle">priority &#183; owner</text><path d="M758 196 L 796 196" stroke="rgba(255,255,255,0.14)" stroke-width="1.6"/><rect x="796" y="160" width="172" height="72" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><text x="882" y="188" font-size="12.5" font-weight="600" letter-spacing="1.1" fill="#f5a623" text-anchor="middle">SLA CLOCK</text><text x="882" y="210" font-size="11.5" fill="#636a82" text-anchor="middle">deadline stamped</text><path d="M968 196 L 996 196" stroke="rgba(255,255,255,0.14)" stroke-width="1.6"/><rect x="996" y="160" width="172" height="72" rx="10" fill="#161921" stroke="rgba(255,255,255,0.08)"/><text x="1082" y="188" font-size="12.5" font-weight="600" letter-spacing="1.1" fill="#9b7dff" text-anchor="middle">ESCALATION</text><text x="1082" y="210" font-size="11.5" fill="#636a82" text-anchor="middle">up the owner&#8217;s chain</text><rect x="996" y="160" width="172" height="72" rx="10" fill="none" stroke="#ff5263" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.80;0.86;1" dur="9s" repeatCount="indefinite"/></rect><text x="1082" y="252" font-size="11.5" font-weight="600" fill="#ff5263" text-anchor="middle" opacity="0">CRITICAL &#183; opened by the monitor<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.80;0.86;1" dur="9s" repeatCount="indefinite"/></text><line x1="48" y1="330" x2="1152" y2="330" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="48" y="360" font-size="13" fill="#e8eaf2">A phone number is not authentication <tspan fill="#636a82">&#183; an unmatched number may file against a school code, is recorded as unverified, and can never read anything back</tspan></text></g><metadata><rights>Copyright 2026 Claytone Curthberth Mhina. The system is the property of Opportunity Education Tanzania. The artwork and text of this page are all rights reserved; no license granted without written permission.</rights></metadata></svg>